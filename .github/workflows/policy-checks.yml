name: Lightweight localization and policy checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/localization/verify_zh_hans.py
      - run: python3 -m unittest discover -s scripts/ci/tests -v
      - run: python3 -m unittest discover -s .github/release_policy -p 'test_*.py' -v
