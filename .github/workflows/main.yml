name: Validate Windows candidate (manual or new upstream release)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      release_manifest:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct released tag plus pinned downstream patch
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - name: Check both Chinese packs and automation invariants
        run: |
          python3 scripts/localization/verify_zh_hans.py
          python3 -m unittest discover -s scripts/ci/tests -v
          dotnet run --project MissionPlannerTests/Localization/Localization.csproj -c Release
  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct released tag plus pinned downstream patch
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize
      - name: Record actual assembled source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Build Release using the independent SDK
        shell: pwsh
        run: ./scripts/localization/build_windows.ps1 -OutputDirectory "$env:RUNNER_TEMP\TitanPlanner-release"
      - name: Run Windows regression tests and both Chinese interfaces
        shell: pwsh
        run: ./scripts/ci/test_windows.ps1 -BuildDirectory "$env:RUNNER_TEMP\TitanPlanner-release" -ResultsDirectory "$env:RUNNER_TEMP\test-results"
      - name: Build Debug
        shell: pwsh
        run: ./scripts/localization/build_windows.ps1 -Configuration Debug -OutputDirectory "$env:RUNNER_TEMP\TitanPlanner-debug"
      - name: Audit resolved dependencies
        shell: pwsh
        run: |
          dotnet list MissionPlanner.csproj package --vulnerable --include-transitive --format json > "$env:RUNNER_TEMP\test-results\dependencies.json"
          if ($LASTEXITCODE) { throw 'Dependency audit failed' }
          python scripts/ci/check_audit.py "$env:RUNNER_TEMP\test-results\dependencies.json"
      - name: Package and round-trip verify Windows ZIP
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: python scripts/ci/package_windows.py "$env:RUNNER_TEMP\TitanPlanner-release" "$env:RUNNER_TEMP\release" "$env:BUILD_SHA"
      - name: Build Chinese MSI from the verified ZIP payload
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python scripts/ci/package_msi.py "$env:RUNNER_TEMP\release" "$env:BUILD_SHA" "$env:GITHUB_RUN_NUMBER" "$env:RUNNER_TEMP\msi-work"
          if ($LASTEXITCODE) { throw 'MSI build failed' }
      - name: Test MSI install, repair, uninstall and preservation of personal data
        shell: pwsh
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: python scripts/ci/test_msi.py "$env:RUNNER_TEMP\release" "$env:BUILD_SHA" "$env:RUNNER_TEMP\test-results"
      - name: Bind final package bytes to this successful native build
        shell: pwsh
        run: python .github/release_policy/receipt.py "$env:RUNNER_TEMP/release" windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results/
          retention-days: 14
