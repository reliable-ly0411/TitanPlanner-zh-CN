name: Linux Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      release_manifest:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct released tag plus pinned downstream patch
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: python3 .github/release_policy/policy.py materialize
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel rsync
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: linux-nuget-${{ hashFiles('**/*.csproj', 'Linux/Build.targets') }}
          restore-keys: linux-nuget-
      - name: Build and package
        run: ./Linux/build.sh 2>&1 | tee linux-build.log
      - name: Test archive with runtime dependencies only
        run: ./Linux/test-package.sh 2>&1 | tee linux-runtime-test.log
      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-linux-x86_64
          path: |
            bin/linux/MissionPlanner-linux-x86_64.tar.gz
            bin/linux/MissionPlanner-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-logs
          path: |
            linux-build.log
            linux-runtime-test.log
